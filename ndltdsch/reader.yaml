openapi: 3.0.3
info:
  title: 大學論文系統 校內檢索端（讀者端）
  description: |
    校內檢索端 API，對應設計稿（ndltdsch/reader-figma）：A09 校內檢索首頁、A10 檢索結果列（A10-1～A10-4 選取、下載全文、引用格式）、
    A11 一般學術論文書目資料（A11-1～A11-4 含多媒體）、A12-1 策展主題列表、A12-2 策展主題論文列表、A13 排行統計、
    A14 論文收藏列表（A14-1～A14-3 尚未收藏/已有收藏/尚未綁證）。
  version: 1.0.0
  contact:
    name: Github 原始碼
    url: https://github.com/econcord-com-tw/ndltd-swagger
servers:
  - url: https://ndltdsch.ncl.edu.tw/api/v1/{school}/thesis
    description: 正式環境


paths:

  # 論文管理 API
  /theses/{id}:
    get:
      tags: [論文]
      summary: 取得單篇論文詳細內容
      description: |
        依論文 id 取得單篇論文完整書目與詳情，對應設計稿 A11 一般學術論文書目資料頁。含標題、作者、指導教授、
        學校系所、摘要關鍵字、目次、參考文獻等；「下載全文」由 GET /theses/{id}/download、「引用格式」由 GET /theses/{id}/citation 支援。
      parameters:
        - name: id
          in: path
          required: true
          description: 論文唯一識別碼
          schema:
            type: string
            example: "1"
      responses:
        '200':
          description: 成功取得論文內容
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  errors:
                    type: array
                    items:
                      type: object
                    example: []
                  messages:
                    type: array
                    items:
                      type: object
                    example: []
                  result:
                    $ref: '#/components/schemas/ThesisDetail'

  /theses/{id}/citation:
    get:
      tags: [論文]
      summary: 取得單篇論文引用格式
      description: 對應設計稿 A10-4 檢索結果列：引用格式、A11 論文書目頁「引用格式」。取得指定論文的引用文字，支援 APA、Chicago、MLA 等格式，回傳 citation_text 供複製引用。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 論文唯一識別碼
        - name: style
          in: query
          schema:
            type: string
            enum: [apa, chicago, mla]
            default: apa
          description: 引用格式
      responses:
        '200':
          description: 成功取得引用格式
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  errors:
                    type: array
                    items:
                      type: object
                    example: []
                  messages:
                    type: array
                    items:
                      type: object
                    example: []
                  result:
                    type: object
                    properties:
                      style:
                        type: string
                        example: "apa"
                      citation_text:
                        type: string
                        description: 該格式的引用內文
        '404':
          description: 找不到該論文
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errors:
                    type: array
                    items:
                      type: object

  /theses/{id}/download:
    get:
      tags: [論文]
      summary: 下載論文全文
      description: 對應設計稿 A10-3 檢索結果列：下載全文、A11 論文書目頁「下載全文」。取得指定論文之電子全文檔案（如 PDF）下載連結或檔案串流。若該論文無授權電子全文則回傳 404 或 403。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 論文唯一識別碼
      responses:
        '200':
          description: 成功，回傳檔案內容（或 Content-Disposition 下載）
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '302':
          description: 重新導向至實際全文檔案 URL
          headers:
            Location:
              schema:
                type: string
                description: 全文檔案 URL
        '403':
          description: 無權限或該論文未開放全文下載
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errors:
                    type: array
                    items:
                      type: object
        '404':
          description: 論文不存在或無電子全文
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errors:
                    type: array
                    items:
                      type: object

  /theses/export:
    post:
      tags: [論文]
      summary: 匯出論文書目資料
      description: 對應設計稿 A10 檢索結果列選取後「匯出書目」、A14 論文收藏列表「匯出書目」。根據指定論文 ID 列表與匯出設定匯出書目資料，可選輸出欄位、引用格式、字碼、檔案格式（txt/csv/excel/pdf），支援預覽模式。需登入。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [thesis_ids, export_settings]
              properties:
                thesis_ids:
                  type: array
                  items:
                    type: string
                  description: 要匯出的論文ID列表
                export_settings:
                  type: object
                  required: [output_position, citation_style, encoding, format]
                  properties:
                    output_position:
                      type: string
                      enum: [simple, complete]
                      description: 輸出欄位（簡易書目/完整書目）
                    citation_style:
                      type: string
                      enum: [apa, chicago, mla, cns13611, cse, ris]
                    encoding:
                      type: string
                      enum: [utf8, big5, gb2312]
                    format:
                      type: string
                      enum: [txt, csv, excel, pdf]
                    preview:
                      type: boolean
                      description: 是否為預覽模式
                      default: false
      responses:
        '200':
          description: 匯出成功（預覽模式）或回傳預覽內容
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  result:
                    type: object
                    properties:
                      preview_content:
                        type: string
                      total_count:
                        type: integer
        '201':
          description: 匯出檔案成功（下載模式）
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                description: 檔案下載標頭
                example: "attachment; filename=thesis_export.txt"
        '400':
          description: 請求參數錯誤
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errors:
                    type: array
                    items:
                      type: object
        '404':
          description: 部分論文不存在或無權限
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errors:
                    type: array
                    items:
                      type: object

  /theses/search:
    post:
      tags: [論文]
      summary: 檢索論文
      description: |
        對應設計稿 A09 校內檢索首頁與 A10 檢索結果列。以 JSON 送交進階查詢條件：多組關鍵字＋可搜尋欄位（ti/au/ab 等）＋布林 and/or、
        畢業學年度、學門、論文類別、全文類型、學位類別、語言等。回傳分頁論文列表（result）與 result_filters（出版日期、論文狀態、
        主題、論文種類、語言、學位類別、聚類分析之可篩選選項與筆數），供左側二度篩選與「進行篩選」；二度篩選條件置於 request body 之 filter。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvancedSearchRequest'
      responses:
        '200':
          description: 成功取得進階檢索結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisSearchResponse'

  # 主題策展 API
  /exhibitions:
    get:
      tags: [主題策展]
      summary: 取得主題策展列表
      description: |
        取得所有主題策展列表，對應設計稿 A12-1 策展主題列表。含主題名稱、圖示、說明，可依分類（熱門主題、學科領域、時事議題、特色研究）與精選篩選。
      parameters:
        - name: page
          in: query
          description: 分頁頁碼（預設為 1）
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: 每頁筆數（預設為 10）
          required: false
          schema:
            type: integer
            default: 10
        - name: category
          in: query
          description: 策展分類篩選
          required: false
          schema:
            type: string
            enum: [熱門主題, 學科領域, 時事議題, 特色研究]
        - name: featured
          in: query
          description: 是否只顯示精選策展
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 成功取得主題策展列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExhibitionListResponse'

  /exhibitions/{id}:
    get:
      tags: [主題策展]
      summary: 取得主題策展詳細內容
      description: |
        依策展 ID 取得主題詳細內容與該主題下論文列表，對應設計稿 A12-2 策展主題論文列表。支援分頁與排序（瀏覽數、下載數、年度、相關性、精選）。
      parameters:
        - name: id
          in: path
          required: true
          description: 主題策展唯一識別碼
          schema:
            type: string
            example: "EXH-AI-EDU-2024"
        - name: page
          in: query
          description: 論文列表分頁頁碼（預設為 1）
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: 每頁論文筆數（預設為 20）
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          description: 論文排序方式
          required: false
          schema:
            type: string
            enum: [viewCount, downloadCount, year, relevance, featured]
            default: featured
      responses:
        '200':
          description: 成功取得主題策展詳細內容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExhibitionDetailResponse'

  # 檢索歷史 API
  /search-history:
    get:
      tags: [檢索歷史]
      summary: 取得檢索歷史
      description: 取得登入使用者之搜尋歷史記錄，按時間倒序排列。需登入。
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: 分頁頁碼（預設為 1）
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: 每頁筆數（預設為 20，最大 100）
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: 成功取得檢索歷史
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchHistoryResponse'

  # 收藏管理 API
  /savedtheses:
    get:
      tags: [收藏管理]
      summary: 我的收藏
      description: |
        取得登入使用者之收藏論文列表，對應設計稿 A14 論文收藏列表（A14-1 尚未收藏、A14-2 已有收藏、A14-3 尚未綁證）。需登入。
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: 分頁頁碼（預設為 1）
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: 每頁筆數（預設為 10）
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 成功取得我的收藏
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedThesesResponse'
    post:
      tags: [收藏管理]
      summary: 新增一筆收藏
      description: 新增一篇論文到目前使用者的收藏，對應檢索結果或論文詳情頁之「加入收藏」。需登入。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: 論文唯一識別碼
                  example: "1"
      responses:
        '200':
          description: 成功新增收藏
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /savedtheses/{id}:
    delete:
      tags: [收藏管理]
      summary: 刪除一筆收藏
      description: 自收藏中移除指定論文。需登入。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 論文唯一識別碼
      responses:
        '200':
          description: 成功刪除收藏
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # 排行榜 API
  /rankings:
    get:
      tags: [排行榜]
      summary: 取得學校熱門排行榜
      description: 取得各校熱門論文排行榜，對應設計稿 A13 排行統計。支援排行類型（全文授權/被引用/被點閱/下載）、年度與筆數限制。
      parameters:
        - name: type
          in: query
          description: 排行類型
          required: true
          schema:
            type: string
            enum: [total, reference, view, download]
        - name: year
          in: query
          description: 年度（如 113、112、111）
          schema:
            type: integer
            example: 113
        - name: limit
          in: query
          description: 限制回傳最大筆數（預設 10，最大 100）
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        '200':
          description: 成功取得排行榜
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingResponse'

  # 統計資訊 API
  /statistics:
    get:
      tags: [統計資訊]
      summary: 取得論文統計資訊
      description: 取得校內（或全站）論文總數、參與學校數、開放取用數、累計下載數、授權率等統計資料，供首頁或統計區塊顯示。
      responses:
        '200':
          description: 成功取得統計資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'


components:
  schemas:
    # 公告相關 Schema
    AnnouncementListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: object
          example: []
        messages:
          type: array
          items:
            type: object
          example: []
        result:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        result_info:
          $ref: '#/components/schemas/PaginationInfo'

    AnnouncementDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: object
          example: []
        messages:
          type: array
          items:
            type: object
          example: []
        result:
          $ref: '#/components/schemas/AnnouncementDetail'

    Announcement:
      type: object
      properties:
        id:
          type: string
          example: "2024011501"
        title:
          type: string
          example: "系統維護公告"
        type:
          type: string
          example: "系統公告"
        summary:
          type: string
          example: "系統維護通知"
        date:
          type: string
          format: date
          example: "2024-01-15"

    AnnouncementDetail:
      allOf:
        - $ref: '#/components/schemas/Announcement'
        - type: object
          properties:
            content:
              type: string
              description: 完整公告內容

    # 論文相關 Schema（與 ndltd/reader.yaml ThesisDetail 欄位一致）
    ThesisDetail:
      type: object
      description: 論文書目與詳情（對應檢索結果列、論文詳情頁、書車列表）
      properties:
        id:
          type: string
          description: 論文唯一識別碼
          example: "1"
        thesis_number:
          type: string
          description: 論文編號
          example: "108NTNU1234567"
        thesis_type:
          type: string
          description: 論文種類（如學術論文、技術報告、作品連同書面報告等）
          example: "學術論文"
        author:
          type: string
          description: 研究生中文名（相容舊欄位）
          example: "王小明"
        author_en:
          type: string
          description: 研究生外文名
          example: "WANG, SIAO-MING"
        title:
          type: string
          description: 論文中文名稱
          example: "台灣博碩士論文網發展現況與展望"
        title_en:
          type: string
          description: 論文外文名稱
          example: "Development and Prospects of Taiwan ETDS"
        supervisor:
          type: string
          description: 指導教授-中文名（相容舊欄位）
          example: "李大華博士"
        supervisor_en:
          type: string
          description: 指導教授-外文名
          example: "LEE, DA-HWA"
        supervisor_email:
          type: string
          format: email
          description: 指導教授E-mail
        co_supervisor:
          type: string
          description: 共同指導教授
        oral_committee:
          type: string
          description: 口試委員（多人可為陣列或逗號分隔，依實作而定）
        oral_committee_en:
          type: string
          description: 口試委員-外文名
        oral_exam_date:
          type: string
          format: date
          description: 口試日期
          example: "2024-06-15"
        degree:
          type: string
          description: 學位類別
          example: "碩士"
        school:
          type: string
          description: 校院名稱
          example: "國立臺灣大學"
        department:
          type: string
          description: 系所名稱
          example: "資訊工程學系"
        year:
          type: integer
          description: 畢業學年度（民國）
          example: 113
        publication_year:
          type: integer
          description: 論文出版年（西元或民國，依實作）
          example: 2024
        student_id:
          type: string
          description: 學號
          example: "M110123456"
        language:
          type: string
          description: 語文別
          example: "中文"
        pages:
          type: integer
          description: 論文頁數
          example: 156
        keywords:
          type: array
          description: 中文關鍵詞
          items:
            type: string
          example: ["論文網", "台灣", "Open Access"]
        keywords_en:
          type: array
          description: 外文關鍵詞
          items:
            type: string
        abstract:
          type: string
          description: 論文中文摘要
          example: "本論文探討台灣博碩士論文網的發展現況..."
        abstract_en:
          type: string
          description: 論文外文摘要
        table_of_contents:
          type: string
          description: 論文目次
        references:
          type: string
          description: 論文參考文獻
        full_text_open_time:
          type: string
          format: date-time
          description: 全文開放時間
        delayed_publication_date:
          type: string
          format: date
          description: 延後公開日期
        original_thesis_url:
          type: string
          format: uri
          description: 原論文連結
        discipline:
          type: string
          description: 學門
          example: "電算機學門"
        discipline_category:
          type: string
          description: 學類
        full_text_file_id:
          type: string
          description: 電子全文檔案ID
        alternative_thesis_file_id:
          type: string
          description: 替代論文檔案ID
        authorization_letter_file_id:
          type: string
          description: 授權書檔案ID
        campus_authorization:
          type: boolean
          description: 校內授權
        ncl_authorization:
          type: boolean
          description: 國圖授權
        database_vendor_authorization:
          type: boolean
          description: 資料庫廠商授權
        cited_count:
          type: integer
          description: 被引用數
          example: 12
        has_full_text:
          type: boolean
          description: 是否有電子全文可下載
          example: true
        has_multimedia:
          type: boolean
          description: 是否含多媒體作品
          example: false

    # 進階檢索：單一查詢條件列（關鍵字 + 欄位 + 與前一條的布林運算）
    AdvancedSearchCriteria:
      type: object
      required: [keyword]
      properties:
        operator:
          type: string
          description: 與前一筆條件的邏輯運算（第一筆不需傳）
          enum: [and, or]
        keyword:
          type: string
          description: 查詢關鍵字
          example: "深度學習"
        field:
          type: string
          default: ""
          enum:
            - ""
            - ti
            - au
            - asc
            - sdp
            - pyr
            - ad
            - say
            - kw
            - tc
            - ab
            - rf
            - yr
            - sglv1
            - sglv2
          description: |
            可搜尋欄位（空=不限欄位）。ti=論文名稱, au=研究生, asc=校院名稱,
            sdp=系所, pyr=論文出版年, ad=指導教授, say=口試委員, kw=關鍵詞,
            tc=論文目次, ab=摘要, rf=論文參考文獻, yr=畢業學年度, sglv1=學門, sglv2=學類
      description: 第一筆可不帶 operator；第二筆起需帶 and 或 or 與前一筆組合

    # 進階檢索請求 body
    AdvancedSearchRequest:
      type: object
      properties:
        keywords:
          type: array
          description: 查詢條件列（可新增多欄位，每筆含關鍵字、欄位、第二筆起含 operator）
          items:
            $ref: '#/components/schemas/AdvancedSearchCriteria'
          example:
            - keyword: "機器學習"
              field: "ti"
            - operator: "and"
              keyword: "教育"
              field: "ab"
        start_year:
          type: integer
          description: 畢業學年度 起始年（民國）
          example: 110
        end_year:
          type: integer
          description: 畢業學年度 結束年（民國）
          example: 113
        discipline:
          type: string
          description: 學門（空為全部）
          enum:
            - ""
            - 教育學門
            - 藝術學門
            - 人文學門
            - 設計學門
            - 社會及行為科學學門
            - 傳播學門
            - 商業及管理學門
            - 法律學門
            - 生命科學學門
            - 自然科學學門
            - 數學及統計學門
            - 電算機學門
            - 工程學門
            - 建築及都市規劃學門
            - 農業科學學門
            - 獸醫學門
            - 醫藥衛生學門
            - 社會服務學門
            - 民生學門
            - 運輸服務學門
            - 環境保護學門
        thesis_type:
          type: string
          description: |
            論文類別（空為全部）。1=學術論文, 2=代替論文：技術報告（應用科技類）,
            3=代替論文：作品連同書面報告（藝術類）, 4=代替論文：成就證明連同書面報告（體育運動類）,
            5=代替論文：專業實務報告（專業實務類）
          enum: ["", "1", "2", "3", "4", "5"]
        full_text_types:
          type: array
          items:
            type: string
            enum: [電子全文, 紙本論文授權, 影音圖像]
        degree_types:
          type: array
          items:
            type: string
            enum: [博士, 碩士]
        languages:
          type: array
          items:
            type: string
            enum: [中文, 日文, 英文, 其他語言]
        sort:
          type: string
          enum: [viewCount, downloadCount, year, relevance]
          default: relevance
        page:
          type: integer
          default: 1
        per_page:
          type: integer
          default: 10
        filter:
          $ref: '#/components/schemas/ResultFilterRequest'
          description: 二度篩選條件（檢索結果頁左側「進行篩選」）

    # 二度篩選 request（檢索結果頁左側「進行篩選」送出的條件）
    ResultFilterRequest:
      type: object
      description: 二度篩選條件，對應 result_filters 各區塊的選項 value
      properties:
        publication_date_filter:
          type: string
          description: 出版日期篩選（自定範圍時填 custom 並搭配 start_year/end_year）
          enum: [last_12_months, last_5_years, last_10_years, custom]
        publication_date_start_year:
          type: integer
          description: 自定日期範圍 開始年份
        publication_date_end_year:
          type: integer
          description: 自定日期範圍 結束年份
        thesis_status:
          type: array
          description: 論文狀態，可多選
          items:
            type: string
            enum: [授權公開, 延後公開]
        subjects:
          type: array
          description: 主題，可多選（與 result_filters.subject.options 的 value 對應）
          items:
            type: string
        thesis_types:
          type: array
          description: 論文種類，可多選（與 result_filters.thesis_type.options 的 value 對應，1~5）
          items:
            type: string
            enum: ["1", "2", "3", "4", "5"]
        cluster_analysis_terms:
          type: array
          description: 聚類分析，可多選（與 result_filters.cluster_analysis 的 value 對應）
          items:
            type: string

    # 檢索結果頁左側「可篩選選項」單一項目（含筆數）
    FilterOptionWithCount:
      type: object
      properties:
        label:
          type: string
          description: 顯示名稱
        value:
          type: string
          description: 送出篩選時使用的值
        count:
          type: integer
          description: 該選項對應的論文筆數

    # 檢索結果：出版日期篩選區塊
    PublicationDateFilterBlock:
      type: object
      properties:
        options:
          type: array
          description: 預設區間選項（前12個月、前5年、前10年）
          items:
            $ref: '#/components/schemas/FilterOptionWithCount'
        custom_range_supported:
          type: boolean
          description: 是否支援自定日期範圍
          default: true

    # 檢索結果：論文狀態篩選區塊
    ThesisStatusFilterBlock:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: '#/components/schemas/FilterOptionWithCount'

    # 檢索結果：主題篩選區塊
    SubjectFilterBlock:
      type: object
      properties:
        options:
          type: array
          description: 依目前檢索結果動態產生的主題與筆數
          items:
            $ref: '#/components/schemas/FilterOptionWithCount'

    # 檢索結果：論文種類篩選區塊（二度篩選）
    ThesisTypeFilterBlock:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: '#/components/schemas/FilterOptionWithCount'

    # 檢索結果：語言篩選區塊（二度篩選）
    LanguageFilterBlock:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: '#/components/schemas/FilterOptionWithCount'

    # 檢索結果：學位類別篩選區塊（二度篩選）
    DegreeTypeFilterBlock:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: '#/components/schemas/FilterOptionWithCount'

    # 檢索結果：聚類分析篩選區塊（二度篩選，可階層展開）
    ClusterAnalysisOption:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        count:
          type: integer
        children:
          type: array
          description: 下層聚類節點（可展開）
          items:
            $ref: '#/components/schemas/ClusterAnalysisOption'

    ClusterAnalysisFilterBlock:
      type: object
      properties:
        options:
          type: array
          description: 聚類分析選項，可含 children 形成階層
          items:
            $ref: '#/components/schemas/ClusterAnalysisOption'

    # 檢索結果頁左側「可篩選」區塊（供前端繪製篩選 UI，並可回傳做二度篩選）
    SearchResultFilters:
      type: object
      description: 檢索結果列左側的篩選區塊（出版日期、論文狀態、主題、論文種類、語言、學位類別、聚類分析），含各選項筆數；可將選取值帶入 request 做二度篩選
      properties:
        publication_date:
          $ref: '#/components/schemas/PublicationDateFilterBlock'
        thesis_status:
          $ref: '#/components/schemas/ThesisStatusFilterBlock'
        subject:
          $ref: '#/components/schemas/SubjectFilterBlock'
        thesis_type:
          $ref: '#/components/schemas/ThesisTypeFilterBlock'
          description: 論文種類（二度篩選）
        language:
          $ref: '#/components/schemas/LanguageFilterBlock'
          description: 語言（二度篩選）
        degree_type:
          $ref: '#/components/schemas/DegreeTypeFilterBlock'
          description: 學位類別（二度篩選）
        cluster_analysis:
          $ref: '#/components/schemas/ClusterAnalysisFilterBlock'
          description: 聚類分析（二度篩選，可階層展開）

    ThesisSearchResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: object
          example: []
        messages:
          type: array
          items:
            type: object
          example: []
        result:
          type: array
          items:
            $ref: '#/components/schemas/ThesisDetail'
        result_info:
          $ref: '#/components/schemas/PaginationInfo'
        result_filters:
          $ref: '#/components/schemas/SearchResultFilters'
          description: 檢索結果可篩選區塊（出版日期、論文狀態、主題、論文種類、語言、學位類別、聚類分析），含各選項筆數；可將選取值帶入下次 request 做二度篩選

    # 主題策展相關 Schema
    ExhibitionListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: object
          example: []
        messages:
          type: array
          items:
            type: object
          example: []
        result:
          type: array
          items:
            $ref: '#/components/schemas/Exhibition'
        result_info:
          $ref: '#/components/schemas/PaginationInfo'

    ExhibitionDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: object
          example: []
        messages:
          type: array
          items:
            type: object
          example: []
        result:
          $ref: '#/components/schemas/ExhibitionDetail'

    Exhibition:
      type: object
      properties:
        id:
          type: string
          description: 主題策展唯一識別碼
          example: "EXH-AI-EDU-2024"
        title:
          type: string
          description: 策展主題名稱
          example: "人工智慧在教育領域的應用"
        description:
          type: string
          description: 策展主題說明
          example: "探討人工智慧技術如何革新教育模式，包含機器學習、自然語言處理等技術在個人化學習、智能輔導等方面的應用研究"
        icon:
          type: string
          description: 主題圖示 URL 或圖示代碼
          example: "🤖"
        category:
          type: string
          description: 策展分類
          enum: [熱門主題, 學科領域, 時事議題, 特色研究]
          example: "熱門主題"
        thesis_count:
          type: integer
          description: 該主題包含的論文數量
          example: 156
        view_count:
          type: integer
          description: 策展瀏覽次數
          example: 2580
        featured:
          type: boolean
          description: 是否為精選策展
          example: true
        created_at:
          type: string
          format: date-time
          description: 策展建立時間
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: 策展最後更新時間
          example: "2024-03-20T14:45:00Z"
        tags:
          type: array
          items:
            type: string
          description: 策展標籤
          example: ["AI", "教育科技", "機器學習", "個人化學習"]

    ExhibitionDetail:
      allOf:
        - $ref: '#/components/schemas/Exhibition'
        - type: object
          properties:
            curator_info:
              type: object
              description: 策展人資訊
              properties:
                name:
                  type: string
                  example: "國立臺灣大學資訊工程學系"
                description:
                  type: string
                  example: "由資工系教授群共同策展，精選AI教育應用相關優質論文"
            theses:
              type: array
              items:
                $ref: '#/components/schemas/ThesisDetail'
              description: 策展包含的論文列表
            theses_info:
              $ref: '#/components/schemas/PaginationInfo'

    # LLM 語義檢索相關 Schema
    LLMResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: object
          example: []
        messages:
          type: array
          items:
            type: object
          example: []
        result:
          type: object
          properties:
            answer:
              type: string
              description: LLM 生成的智能回應
              example: "根據您的需求，我為您找到了幾篇關於人工智慧在教育領域應用的優質論文。這些研究主要聚焦在機器學習技術如何改善教學效果、個人化學習系統的設計，以及AI輔助教學工具的開發。以下是相關的論文推薦："
            query_analysis:
              type: object
              description: 查詢分析結果
              properties:
                keywords:
                  type: array
                  items:
                    type: string
                  description: 提取的關鍵字
                  example: ["人工智慧", "教育", "機器學習", "教學應用"]
                intent:
                  type: string
                  description: 查詢意圖
                  example: "尋找AI在教育領域的應用研究"
                suggested_filters:
                  type: object
                  description: 建議的搜尋篩選條件
                  properties:
                    keywords:
                      type: array
                      items:
                        type: string
                      example: ["artificial intelligence", "education", "machine learning"]
                    subjects:
                      type: array
                      items:
                        type: string
                      example: ["教育學", "資訊工程"]
            recommended_theses:
              type: array
              items:
                $ref: '#/components/schemas/RecommendedThesis'
              description: 推薦的相關論文
            processing_time:
              type: number
              format: float
              description: 處理時間（秒）
              example: 1.25

    RecommendedThesis:
      type: object
      properties:
        id:
          type: string
          example: "thesis_001"
        title:
          type: string
          example: "機器學習在個人化教育系統中的應用研究"
        author:
          type: string
          example: "張小明"
        school:
          type: string
          example: "國立臺灣大學"
        year:
          type: integer
          example: 113
        relevance_score:
          type: number
          format: float
          description: 相關性評分（0-1）
          example: 0.92
        summary:
          type: string
          description: 論文摘要（可選）
          example: "本研究探討機器學習技術在個人化教育系統中的應用，提出了一套基於學習者行為分析的智能推薦算法..."
        match_reasons:
          type: array
          items:
            type: string
          description: 匹配原因
          example: ["關鍵字匹配: 機器學習", "主題相關: 教育技術", "研究方法相似"]

