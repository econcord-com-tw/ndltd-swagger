        thesis_type:
          $ref: '#/components/schemas/ThesisTypeFilterBlock'
          description: 論文種類（二度篩選）
        language:
          $ref: '#/components/schemas/LanguageFilterBlock'
          description: 語言（二度篩選）
        degree_type:
          $ref: '#/components/schemas/DegreeTypeFilterBlock'
          description: 學位類別（二度篩選）
        cluster_analysis:
          $ref: '#/components/schemas/ClusterAnalysisFilterBlock'
          description: 聚類分析（二度篩選，可階層展開）

    ThesisSearchResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: object
          example: []
        messages:
          type: array
          items:
            type: object
          example: []
        result:
          type: array
          items:
            $ref: '#/components/schemas/ThesisDetail'
        result_info:
          $ref: '#/components/schemas/PaginationInfo'
        result_filters:
          $ref: '#/components/schemas/SearchResultFilters'
          description: 檢索結果可篩選區塊（出版日期、論文狀態、主題、論文種類、語言、學位類別、聚類分析），含各選項筆數；可將選取值帶入下次 request 做二度篩選

    # LLM 語義檢索相關 Schema
    LLMResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: object
          example: []
        messages:
          type: array
          items:
            type: object
          example: []
        result:
          type: object
          properties:
            answer:
              type: string
              description: LLM 生成的智能回應
              example: "根據您的需求，我為您找到了幾篇關於人工智慧在教育領域應用的優質論文。這些研究主要聚焦在機器學習技術如何改善教學效果、個人化學習系統的設計，以及AI輔助教學工具的開發。以下是相關的論文推薦："
            query_analysis:
              type: object
              description: 查詢分析結果
              properties:
                keywords:
                  type: array
                  items:
                    type: string
                  description: 提取的關鍵字
                  example: ["人工智慧", "教育", "機器學習", "教學應用"]
                intent:
                  type: string
                  description: 查詢意圖
                  example: "尋找AI在教育領域的應用研究"
                suggested_filters:
                  type: object
                  description: 建議的搜尋篩選條件
                  properties:
                    keywords:
                      type: array
                      items:
                        type: string
                      example: ["artificial intelligence", "education", "machine learning"]
                    subjects:
                      type: array
                      items:
                        type: string
                      example: ["教育學", "資訊工程"]
            recommended_theses:
              type: array
              items:
                $ref: '#/components/schemas/RecommendedThesis'
              description: 推薦的相關論文
            processing_time:
              type: number
              format: float
              description: 處理時間（秒）
              example: 1.25

    RecommendedThesis:
      type: object
      properties:
        id:
          type: string
          example: "thesis_001"
        title:
          type: string
          example: "機器學習在個人化教育系統中的應用研究"
        author:
          type: string
          example: "張小明"
        school:
          type: string
          example: "國立臺灣大學"
        year:
          type: integer
          example: 113
        relevance_score:
          type: number
          format: float
          description: 相關性評分（0-1）
          example: 0.92
        summary:
          type: string
          description: 論文摘要（可選）
          example: "本研究探討機器學習技術在個人化教育系統中的應用，提出了一套基於學習者行為分析的智能推薦算法..."
        match_reasons:
          type: array
          items:
            type: string
          description: 匹配原因
          example: ["關鍵字匹配: 機器學習", "主題相關: 教育技術", "研究方法相似"]

    # 檢索歷史相關 Schema
    SearchHistoryResponse:
