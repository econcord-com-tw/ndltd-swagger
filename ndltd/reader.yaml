    # 申請大量書目相關 Schema
    BatchBibliographyApplicationRequest:
      type: object
      required: [basic_info, bibliography_requirements, research_plan, accept_terms]
      description: 申請大量書目表單（四步驟合併送出）
      properties:
        basic_info:
          $ref: '#/components/schemas/BatchBibliographyBasicInfo'
        bibliography_requirements:
          $ref: '#/components/schemas/BatchBibliographyRequirements'
        research_plan:
          $ref: '#/components/schemas/BatchBibliographyResearchPlan'
        accept_terms:
          type: boolean
          description: 是否已詳細閱讀並同意申請須知，所提供資訊均屬實
          example: true

    BatchBibliographyBasicInfo:
      type: object
      description: 1. 基本資料 - 申請人基本資訊
      required: [name, service_organization, contact_phone, job_title, id_number, email]
      properties:
        name:
          type: string
          description: 姓名（必填）
          example: "王小明"
        service_organization:
          type: string
          description: 服務機構（必填）
          example: "國立臺灣大學"
        contact_phone:
          type: string
          description: 聯絡電話（必填）
          example: "02-12345678"
        unit_type:
          type: string
          description: 單位類別（選填）
          example: "大專院校"
        job_title:
          type: string
          description: 職稱（必填）
          example: "助理教授"
        id_number:
          type: string
          description: 身分證號（必填）
          example: "A123456789"
        email:
          type: string
          format: email
          description: 電子郵件（必填）
          example: "user@example.com"

    BatchBibliographyRequirements:
      type: object
      description: 2. 書目需求 - 資料範圍與格式要求
      required: [data_type, start_academic_year, end_academic_year, disciplines, file_formats]
      properties:
        data_type:
          type: string
          description: 資料類型（簡目=基本資訊 / 詳目=含摘要關鍵字等）
          enum: [簡目, 詳目]
        start_academic_year:
          type: integer
          description: 起始學年度（民國年）
          example: 108
        end_academic_year:
          type: integer
          description: 結束學年度（民國年）
          example: 113
        disciplines:
          type: array
          description: 學門選擇，可多選
          items:
            type: string
            enum:
              - 教育學門
              - 藝術學門
              - 人文學門
              - 設計學門
              - 社會及行為科學學門
              - 傳播學門
              - 商業及管理學門
              - 法律學門
              - 生命科學學門
              - 自然科學學門
              - 數學及統計學門
              - 電算機學門
              - 工程學門
              - 建築及都市規劃學門
              - 農業科學學門
              - 獸醫學門
              - 醫藥衛生學門
              - 社會服務學門
              - 民生學門
              - 運輸服務學門
              - 環境保護學門
        file_formats:
          type: array
          description: 檔案格式，可多選
          items:
            type: string
            enum: [CSV, JSON, XLSX, ODF]

    BatchBibliographyResearchPlan:
      type: object
      description: 3. 研究規劃 - 研究計畫詳細資訊
      required: [research_title, research_origin, research_objective]
      properties:
        research_title:
          type: string
          description: 研究名稱（必填）
          example: "臺灣博碩士論文開放取用與引用分析"
        research_origin:
          type: string
          description: 研究緣起（必填）
          example: "請描述研究的背景及動機..."
        research_objective:
          type: string
          description: 研究目的（必填）
          example: "請描述研究的目標與預期貢獻..."
        research_outcome_types:
          type: array
          description: 研究成果類型，可多選
          items:
            type: string
            enum: [會議論文, 博碩士論文, 研究報告, 期刊論文, 專書, 其他]

    BatchBibliographyApplicationResponse:
      type: object
      description: 申請已送出之回應
      properties:
        success:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: object
          example: []
        messages:
          type: array
          items:
            type: object
          example: []
        result:
          type: object
          properties:
            application_id:
              type: string
              description: 申請案編號
              example: "BB202402200001"
            message:
              type: string
              description: 確認訊息（系統將寄送確認郵件至申請人信箱）
              example: "您的書目資料申請已送出，我們將於5個工作日內回覆您，請留意信箱訊息。"

    # 分頁資訊 Schema
    PaginationInfo:
      type: object
      properties:
        page:
          type: integer
          description: 當前頁碼
          example: 1
        per_page:
          type: integer
          description: 每頁筆數
          example: 10
        count:
          type: integer
          description: 當前頁面筆數
          example: 10
        total_count:
          type: integer
          description: 總筆數
          example: 200
        total_pages:
          type: integer
          description: 總頁數
          example: 20

