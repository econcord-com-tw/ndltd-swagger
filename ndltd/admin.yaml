  /issues:
    get:
      tags: [問題回報管理]
      summary: 取得問題回報清單
      description: 取得所有問題回報的管理清單，對應設計稿 M07-1 未處理、M07-2 已處理、M07-3 我願授權（可依 category 篩選）。
