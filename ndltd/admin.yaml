  # 論文統計報表 API（M06：報表類型、條件、預覽、匯出、追蹤）
  /reports/types:
    get:
      tags: [論文統計報表]
      summary: 取得報表類型清單
      description: 對應設計稿 M06-3 選擇報表類型。取得可產生的報表類型（如授權率/送存率、工作項目、指導教授、論文報表查詢、機構典藏等）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTypeListResponse'

  /reports/preview:
    post:
      tags: [論文統計報表]
      summary: 產生報表預覽
      description: 對應設計稿 M06-4 輸入報表條件、M06-5 瀏覽資料呈現。依報表類型與條件產生預覽資料。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportPreviewRequest'
      responses:
        '200':
          description: 成功，回傳預覽資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPreviewResponse'
    delete:
      tags: [論文統計報表]
      summary: 刪除預覽資料
      description: 對應設計稿 M06-5 資料預覽區「刪除資料」。刪除已選取之預覽資料或清空預覽。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: 欲刪除之預覽列 ID，不傳則清空全部
      responses:
        '200':
          description: 刪除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /reports/export:
    post:
      tags: [論文統計報表]
      summary: 匯出報表檔案
      description: 對應設計稿 M06-6 匯出報表檔案。依目前預覽或條件匯出為檔案（如 CSV/Excel）。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                report_type:
                  type: string
                format:
                  type: string
                  enum: [csv, xlsx]
                  default: xlsx
                preview_ids:
                  type: array
                  items:
                    type: string
                  description: 指定預覽列 ID，不傳則匯出目前條件下全部
      responses:
        '200':
          description: 成功，回傳檔案或下載連結
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportResponse'

  /reports/export-history:
    get:
      tags: [論文統計報表]
      summary: 取得匯出紀錄
      description: 對應設計稿 M06-7 追蹤完成行動、M06-5 查看匯出紀錄。取得報表匯出歷史清單。
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: report_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportHistoryResponse'

  /statistics:
    get:
      tags: [靜態資料]
      summary: 取得論文統計資料
      description: 取得論文或 API 相關之統計資料，對應設計稿 M06 論文統計報表（API 使用統計等）。
      parameters:
        - name: api_key_id
          in: query
          description: 特定 API 金鑰 ID
          schema:
            type: string
            example: "api001"
        - name: date_from
          in: query
          description: 統計開始日期
          schema:
            type: string
            format: date
            example: "2025-09-01"
        - name: date_to
          in: query
          description: 統計結束日期
          schema:
            type: string
            format: date
            example: "2025-09-30"
      responses:
        '200':
          description: 成功取得 API 使用統計
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiStatisticsResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # 認證相關 Schema
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: 電子郵件
          example: "admin@ncl.edu.tw"
        password:
          type: string
          description: 密碼
          example: "password123"

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: object
          example: []
        messages:
          type: array
          items:
            type: object
          example: []
        result:
          type: object
          properties:
            token:
              type: string
              description: JWT 認證令牌
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            expires_in:
              type: integer
              description: 令牌有效期（秒）
              example: 3600
            user:
              $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: string
          description: 使用者唯一識別碼
          example: "admin001"
        name:
          type: string
          description: 姓名
          example: "國圖管理員"
        email:
          type: string
          format: email
          description: 電子郵件
          example: "admin@ncl.edu.tw"
        department:
          type: string
          description: 單位
          example: "國家圖書館"
        position:
          type: string
          description: 職稱
          example: "系統管理員"
        permissions:
          type: array
          items:
            type: string
          description: 權限清單
          example: ["公告管理", "帳號管理", "系統設定"]
        last_login:
          type: string
          format: date-time
          description: 最後登入時間
          example: "2025-09-25T14:17:31Z"

    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: object
          example: []
        messages:
          type: array
          items:
            type: object
          example: []
        result:
          $ref: '#/components/schemas/UserProfile'

    # 公告相關 Schema
    Announcement:
      type: object
      properties:
        id:
          type: string
          description: 公告唯一識別碼
          example: "2024011501"
        title:
          type: string
          description: 公告標題
          example: "系統維護公告"
        type:
          type: string
          description: 公告分類
          enum: [系統公告, 最新消息, 維護通知, 功能更新]
          example: "系統公告"
        summary:
          type: string
          description: 公告摘要
          example: "系統維護通知"
        content:
          type: string
          description: 完整公告內容
          example: "系統將於 2024-01-15 進行維護，維護期間系統將暫停服務..."
        status:
          type: string
          description: 公告狀態
          enum: [草稿, 已發布, 已下架]
          example: "已發布"
        date:
          type: string
          format: date
          description: 公告日期
          example: "2024-01-15"
        publish_date:
          type: string
          format: date-time
          description: 發布時間
          example: "2024-01-15T10:30:00Z"
        created_at:
          type: string
          format: date-time
          description: 建立時間
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: 更新時間
          example: "2024-01-15T10:30:00Z"
        author:
          type: string
          description: 發布者
          example: "系統管理員"

    AnnouncementCreate:
      type: object
      required: [title, type, summary, content]
      properties:
        title:
          type: string
          description: 公告標題
          example: "系統維護公告"
        type:
          type: string
          description: 公告分類
          enum: [系統公告, 最新消息, 維護通知, 功能更新]
          example: "系統公告"
        summary:
          type: string
          description: 公告摘要
          example: "系統維護通知"
        content:
          type: string
          description: 完整公告內容
          example: "系統將於 2024-01-15 進行維護，維護期間系統將暫停服務..."
        date:
          type: string
          format: date
          description: 公告日期
          example: "2024-01-15"
        publish_date:
          type: string
          format: date-time
          description: 發布時間
          example: "2024-01-15T10:30:00Z"
        author:
          type: string
          description: 發布者
          example: "系統管理員"

    AnnouncementUpdate:
      type: object
      properties:
        title:
          type: string
          description: 公告標題
          example: "系統維護公告"
        type:
          type: string
          description: 公告分類
          enum: [系統公告, 最新消息, 維護通知, 功能更新]
          example: "系統公告"
        summary:
          type: string
          description: 公告摘要
          example: "系統維護通知"
        content:
          type: string
          description: 完整公告內容
          example: "系統將於 2024-01-15 進行維護，維護期間系統將暫停服務..."
        status:
          type: string
          description: 公告狀態
          enum: [草稿, 已發布, 已下架]
          example: "已發布"
        date:
          type: string
          format: date
          description: 公告日期
          example: "2024-01-15"
        publish_date:
          type: string
          format: date-time
          description: 發布時間
          example: "2024-01-15T10:30:00Z"
        author:
          type: string
