openapi: 3.0.3
info:
  title: 博碩士論文系統 國圖管理端
  description: |
    國圖管理端 API，對應設計稿（ndltd/admin-figma）：M01 首頁、M02 人員權限管理（M02-1 新增、M02-2 編輯）、
    M03 學校帳號與系所管理（M03-1～M03-4 系所代碼/合併等）、M04 論文書目管理、M05 紙本論文送存作業（點收、書目檢核、書目審查）、
    M06 論文統計報表（M06-1～M06-7 多欄位/報表類型/條件/呈現/匯出/追蹤）、M07 問題回報（M07-1～M07-3 未處理/已處理/我願授權）、
    M08 最新消息/常見問答/關於本站（M08-1～M08-3）、SYS01 系統設定、SYS02 系統紀錄與 API token 管理。
  version: 1.0.0
  contact:
    name: Github 原始碼
    url: https://github.com/econcord-com-tw/ndltd-swagger

servers:
  - url: https://ndltdapi.ncl.edu.tw/api/v1/admin
    description: 正式環境

security:
  - bearerAuth: []

paths:
  # 認證相關 API
  /auth/login:
    post:
      tags: [認證]
      summary: 使用者登入
      description: 國圖管理員登入系統，取得 JWT 後可操作 M01～M06 各功能。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 登入失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [認證]
      summary: 使用者登出
      description: 國圖管理員登出，使當前 JWT 失效。
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/me:
    get:
      tags: [認證]
      summary: 取得當前使用者資訊
      description: 取得目前登入的國圖管理員資訊，供 M01 首頁或 header 顯示。
      responses:
        '200':
          description: 成功取得使用者資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: 未授權或令牌無效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # 公告管理 API
  /announcements:
    get:
      tags: [公告管理]
      summary: 取得公告清單
      description: 取得所有公告之管理清單，可依分類、狀態、關鍵字篩選。對應設計稿 M08-1 最新消息。
      parameters:
        - name: page
          in: query
          description: 分頁頁碼
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: 每頁筆數
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          description: 公告分類篩選
          schema:
            type: string
            enum: [系統公告, 最新消息, 維護通知, 功能更新]
        - name: status
          in: query
          description: 公告狀態篩選
          schema:
            type: string
            enum: [草稿, 已發布, 已下架]
        - name: keyword
          in: query
          description: 關鍵字搜尋（標題）
          schema:
            type: string
            example: "維護"
      responses:
        '200':
          description: 成功取得公告清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementListResponse'
    
    post:
      tags: [公告管理]
      summary: 新增公告
      description: 建立一個新的公告
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementCreate'
      responses:
        '201':
          description: 成功新增公告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementResponse'

  /announcements/{id}:
    get:
      tags: [公告管理]
      summary: 取得單一公告
      description: 取得指定 ID 的公告詳細資訊
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "2024011501"
          description: 公告唯一識別碼
      responses:
        '200':
          description: 成功取得公告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementResponse'
        '404':
          description: 找不到指定的公告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags: [公告管理]
      summary: 更新公告
      description: 更新指定 ID 的公告資訊
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "2024011501"
          description: 公告唯一識別碼
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementUpdate'
      responses:
        '200':
          description: 成功更新公告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementResponse'
        '404':
          description: 找不到指定的公告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags: [公告管理]
      summary: 刪除公告
      description: 刪除指定 ID 的公告
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "2024011501"
          description: 公告唯一識別碼
      responses:
        '200':
          description: 成功刪除公告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: 找不到指定的公告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # 待辦事項 API
  /todo:
    get:
      tags: [待辦事項]
      summary: 取得待辦事項清單
      description: 取得國圖管理者之待辦事項清單，對應 M01 首頁工作台。
      responses:
        '200':
          description: 成功取得待辦事項清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoListResponse'

  # 帳號管理 API
  /users:
    get:
      tags: [帳號管理]
      summary: 取得使用者清單
      description: 取得所有使用者之帳號資訊清單，對應設計稿 M02 人員權限管理。可依單位、職稱、關鍵字篩選。
      parameters:
        - name: page
          in: query
          description: 分頁頁碼
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: 每頁筆數
          schema:
            type: integer
            default: 20
        - name: department
          in: query
          description: 依單位篩選
          schema:
            type: string
            example: "國家圖書館"
        - name: role
          in: query
          description: 依職稱篩選
          schema:
            type: string
            example: "管理員"
        - name: keyword
          in: query
          description: 關鍵字搜尋（姓名或email）
          schema:
            type: string
            example: "王小明"
      responses:
        '200':
          description: 成功取得使用者清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    
    post:
      tags: [帳號管理]
      summary: 新增使用者
      description: 建立一個新的使用者帳號
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: 成功新增使用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /users/{id}:
    get:
      tags: [帳號管理]
      summary: 取得單一使用者資訊
      description: 取得指定 ID 的使用者詳細資訊
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "user001"
          description: 使用者唯一識別碼
      responses:
        '200':
          description: 成功取得使用者資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: 找不到指定的使用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags: [帳號管理]
      summary: 更新使用者資訊
      description: 更新指定 ID 的使用者資訊
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "user001"
          description: 使用者唯一識別碼
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: 成功更新使用者資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: 找不到指定的使用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags: [帳號管理]
      summary: 刪除使用者
      description: 刪除指定 ID 的使用者帳號
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "user001"
          description: 使用者唯一識別碼
      responses:
        '200':
          description: 成功刪除使用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: 找不到指定的使用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # 學校使用者管理 API
  /schoolusers:
    get:
      tags: [學校使用者管理]
      summary: 取得學校使用者清單
      description: 查詢所有學校使用者及其角色、權限設定
      parameters:
        - name: role
          in: query
          description: 角色篩選
          schema:
            type: string
            enum: [管理員, 審查人員, 工讀生, 系所人員, 其他]
        - name: department
          in: query
          description: 系所篩選
          schema:
            type: string
            example: "資訊工程學系"
        - name: page
          in: query
          description: 分頁頁碼
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: 每頁筆數
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功取得學校使用者清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolUserListResponse'
    
    post:
      tags: [學校使用者管理]
      summary: 新增學校人員
      description: 新增一位新的學校使用者並設定角色與權限
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolUserCreate'
      responses:
        '201':
          description: 成功新增學校人員
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolUserResponse'

  /schoolusers/{userId}:
    get:
      tags: [學校使用者管理]
      summary: 取得學校使用者資訊
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            example: "user001"
      responses:
        '200':
          description: 成功取得學校使用者資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolUserResponse'
    
    put:
      tags: [學校使用者管理]
      summary: 編輯學校使用者權限
      description: 更新學校使用者角色與權限
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            example: "user001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolUserUpdate'
      responses:
        '200':
          description: 成功更新學校使用者資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolUserResponse'
    
    delete:
      tags: [學校使用者管理]
      summary: 刪除學校使用者
      description: 移除學校使用者帳號
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            example: "user001"
      responses:
        '200':
          description: 成功刪除學校使用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # 論文管理 API
  # 論文書目管理 API（M04）
  /theses:
    get:
      tags: [論文管理]
      summary: 取得論文清單
      description: 取得所有論文的管理清單，支援多種篩選條件
      parameters:
        - name: page
          in: query
          description: 分頁頁碼
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: 每頁筆數
          schema:
            type: integer
            default: 20
        - name: keyword
          in: query
          description: 關鍵字搜尋（標題、作者、摘要）
          schema:
            type: string
            example: "Open Access"
        - name: school
          in: query
          description: 學校名稱篩選
          schema:
            type: string
            example: "國立臺灣大學"
        - name: author
          in: query
          description: 作者篩選
          schema:
            type: string
            example: "王小明"
        - name: degree
          in: query
          description: 學位篩選
          schema:
            type: string
            enum: [碩士, 博士, 其他]
        - name: year
          in: query
          description: 年度篩選
          schema:
            type: integer
            example: 113
        - name: status
          in: query
          description: 論文狀態篩選
          schema:
            type: string
            enum: [審核中, 已通過, 已拒絕, 已發布]
      responses:
        '200':
          description: 成功取得論文清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisListResponse'
    
    post:
      tags: [論文管理]
      summary: 新增論文
      description: 建立一筆新的論文記錄
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThesisCreate'
      responses:
        '201':
          description: 成功新增論文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisResponse'

  /theses/{id}:
    get:
      tags: [論文管理]
      summary: 取得單篇論文詳細內容
      description: 依論文 ID 取得詳細內容
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "1"
          description: 論文唯一識別碼
      responses:
        '200':
          description: 成功取得論文內容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisResponse'
        '404':
          description: 找不到指定的論文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags: [論文管理]
      summary: 更新論文資訊
      description: 更新指定 ID 的論文完整資訊
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "1"
          description: 論文唯一識別碼
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThesisUpdate'
      responses:
        '200':
          description: 成功更新論文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisResponse'
        '404':
          description: 找不到指定的論文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags: [論文管理]
      summary: 刪除論文
      description: 刪除指定 ID 的論文記錄
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "1"
          description: 論文唯一識別碼
      responses:
        '200':
          description: 成功刪除論文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: 找不到指定的論文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /theses/search:
    get:
      tags: [論文管理]
      summary: 搜尋論文
      description: 依多種條件進階搜尋論文
      parameters:
        - name: keyword
          in: query
          description: 關鍵字（標題、摘要、關鍵字等模糊搜尋）
          schema:
            type: string
            example: "Open Access"
        - name: school
          in: query
          description: 學校名稱
          schema:
            type: string
            example: "國立臺灣大學"
        - name: author
          in: query
          description: 作者
          schema:
            type: string
            example: "王小明"
        - name: degree
          in: query
          description: 學位（碩士/博士/其他）
          schema:
            type: string
            enum: [碩士, 博士, 其他]
        - name: year
          in: query
          description: 年度
          schema:
            type: integer
            example: 113
        - name: sort
          in: query
          description: 排序方式
          schema:
            type: string
            enum: [created_at, updated_at, year, title]
            default: created_at
        - name: limit
          in: query
          description: 限制回傳最大筆數（預設 20，最大 100）
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: 成功取得搜尋結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisSearchResponse'

  # 紙本論文送存作業 API（M05：點收、書目檢核、書目審查）
  /paper-deposits/summary:
    get:
      tags: [紙本送存]
      summary: 取得點收摘要
      description: 對應設計稿 M05、M05-1 紙本論文送存作業：點收。取得已寄出箱單數、點收中箱單數，供儀表板顯示。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperDepositSummaryResponse'

  /paper-deposits/boxes:
    get:
      tags: [紙本送存]
      summary: 取得箱單名冊
      description: 對應設計稿 M05-1 箱單名冊。列出待點收或點收中的論文箱，含箱號、學校、論文類型數量、點收進度。
      parameters:
        - name: status
          in: query
          description: 箱單狀態
          schema:
            type: string
            enum: [all, sent, in_receipt]
            default: all
        - name: school
          in: query
          description: 學校名稱篩選
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoxListResponse'

  /paper-deposits/boxes/scan:
    post:
      tags: [紙本送存]
      summary: 掃描或輸入箱號
      description: 對應設計稿 M05、M05-1。掃描箱子外側箱貼條碼或輸入箱號，建立/取得學校送存清單以進行點收。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoxScanRequest'
      responses:
        '200':
          description: 成功，回傳箱單資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoxDetailResponse'
        '404':
          description: 找不到該箱號
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /paper-deposits/boxes/{boxId}:
    get:
      tags: [紙本送存]
      summary: 取得單一箱單詳情
      description: 取得指定箱單的詳細資訊（箱號、學校、論文類型數量、點收數量等）。
      parameters:
        - name: boxId
          in: path
          required: true
          schema:
            type: string
          description: 箱單唯一識別碼
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoxDetailResponse'
        '404':
